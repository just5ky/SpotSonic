# SpotSonic configuration example
# Copy to config.yaml and fill in your values.
# Note: config.yaml is gitignored — never commit credentials.

# Navidrome server URL (no trailing slash)
server: http://localhost:4533

# Navidrome login
user: admin
password: yourpassword

# Input: path to an Exportify CSV file or a directory containing CSV files
input: ./spotify_playlists/

# Fuzzy match threshold (0.0–1.0, default 0.80)
# Higher = stricter matching (fewer false positives, more unmatched)
# Lower  = looser matching (more matches, possible wrong songs)
threshold: 0.80

# dry-run: preview matches without creating playlists (true/false)
dry_run: false

# report: path to save unmatched tracks CSV (leave empty to skip)
report: unmatched.csv
